services:
  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./output:/app/output
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://pikspeak:pikspeak@postgres:5432/pikspeak
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - SPORTS_DATA_PROVIDER=${SPORTS_DATA_PROVIDER:-sportmonks}
      - API_FOOTBALL_KEY=${API_FOOTBALL_KEY}
      - API_FOOTBALL_BASE_URL=${API_FOOTBALL_BASE_URL:-https://v3.football.api-sports.io}
      - API_FOOTBALL_MAX_REQUESTS=${API_FOOTBALL_MAX_REQUESTS:-0}
      - API_FOOTBALL_SEASON_MODE=${API_FOOTBALL_SEASON_MODE:-range}
      - API_FOOTBALL_SEASON_LIST=${API_FOOTBALL_SEASON_LIST:-}
      - API_FOOTBALL_SEASON_FROM=${API_FOOTBALL_SEASON_FROM:-2022}
      - API_FOOTBALL_SEASON_TO=${API_FOOTBALL_SEASON_TO:-2024}
      - SPORTMONKS_API_KEY=${SPORTMONKS_API_KEY:-}
      - SPORTMONKS_BASE_URL=${SPORTMONKS_BASE_URL:-https://api.sportmonks.com/v3/football}
      - FOOTBALL_DATA_API_KEY=${FOOTBALL_DATA_API_KEY:-}
      - FOOTBALL_DATA_BASE_URL=${FOOTBALL_DATA_BASE_URL:-https://api.football-data.org/v4}
      - FOOTBALL_DATA_COMPETITION_MAP=${FOOTBALL_DATA_COMPETITION_MAP:-39:PL,140:PD,78:BL1,135:SA,61:FL1}
      - ODDS_API_KEY=${ODDS_API_KEY}
      - AI_GATEWAY_API_KEY=${AI_GATEWAY_API_KEY}
      - PREDICTION_MODEL=${PREDICTION_MODEL:-anthropic/claude-sonnet-4-5-20250514}
      - FIXTURE_SYNC_ENABLED=${FIXTURE_SYNC_ENABLED:-true}
      - FIXTURE_SYNC_HORIZON_DAYS=${FIXTURE_SYNC_HORIZON_DAYS:-7}
      - FIXTURE_SYNC_LEAGUE_IDS=${FIXTURE_SYNC_LEAGUE_IDS:-39,140,78,135,61}
      - FIXTURE_SYNC_STATUS_FILTER=${FIXTURE_SYNC_STATUS_FILTER:-NS-TBD-1H-2H-HT-LIVE-FT-AET-PEN-PST-CANC-ABD}
      - PIPELINE_DIRECT_FETCH_ENABLED=${PIPELINE_DIRECT_FETCH_ENABLED:-true}
      - PIPELINE_MATCH_LOOKAHEAD_HOURS=${PIPELINE_MATCH_LOOKAHEAD_HOURS:-48}
      - PIPELINE_API_STATUS_FILTER=${PIPELINE_API_STATUS_FILTER:-NS}
      - MATCH_CSV_EXPORT_ENABLED=${MATCH_CSV_EXPORT_ENABLED:-true}
      - MATCH_CSV_EXPORT_DIR=${MATCH_CSV_EXPORT_DIR:-output/match-csv}
      - MATCH_CSV_EXPORT_FILENAME=${MATCH_CSV_EXPORT_FILENAME:-match-prediction-versions-latest.csv}
      - MATCH_CSV_EXPORT_INCLUDE_PENDING=${MATCH_CSV_EXPORT_INCLUDE_PENDING:-true}
      - MATCH_CSV_EXPORT_INCLUDE_FINISHED=${MATCH_CSV_EXPORT_INCLUDE_FINISHED:-true}
      - WEATHER_INTEL_ENABLED=${WEATHER_INTEL_ENABLED:-false}
      - WEATHER_INTEL_TIMEOUT_MS=${WEATHER_INTEL_TIMEOUT_MS:-5000}
      - LOCATION_INTEL_ENABLED=${LOCATION_INTEL_ENABLED:-false}
      - LOCATION_INTEL_TIMEOUT_MS=${LOCATION_INTEL_TIMEOUT_MS:-5000}
      - ADMIN_API_KEY=${ADMIN_API_KEY}
      - REVENUECAT_WEBHOOK_SECRET=${REVENUECAT_WEBHOOK_SECRET}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://pikspeak.app}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pikspeak
      POSTGRES_PASSWORD: pikspeak
      POSTGRES_DB: pikspeak
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pikspeak"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
