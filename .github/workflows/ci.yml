name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]

jobs:
  checks:
    if: github.event.action != 'labeled' || github.event.label.name == 'run-ci'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - task: typecheck
            command: bun run typecheck
          - task: test
            command: bun test
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run ${{ matrix.task }}
        run: ${{ matrix.command }}

  backend:
    if: github.event.action != 'labeled' || github.event.label.name == 'run-ci'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pikspeak
          POSTGRES_PASSWORD: pikspeak
          POSTGRES_DB: pikspeak_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts && cd packages/backend && bun install

      - name: Typecheck backend
        run: cd packages/backend && bunx tsc --noEmit

      - name: Test backend
        run: cd packages/backend && bun test
        env:
          DATABASE_URL: postgresql://pikspeak:pikspeak@localhost:5432/pikspeak_test
          JWT_SECRET: test-secret
          NODE_ENV: test
